<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Play NGN</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><p class="eyebrow">CHESS ENGINE</p><h1>Play NGN</h1><p>Choose a side and make your move.</p></header><div class="layout"><section class="game" aria-label="Chess game"><div class="gamehead"><strong id="status" role="status">Loading engine…</strong><span id="turn"></span></div><div id="board" class="board" aria-label="Chess board"></div><div id="promotion" hidden><span>Promote to </span><button data-piece="q">Queen</button><button data-piece="r">Rook</button><button data-piece="b">Bishop</button><button data-piece="n">Knight</button></div></section><aside><h2>New game</h2><label for="side">Play as</label><select id="side"><option value="w">White</option><option value="b">Black</option></select><label for="time">Move time (seconds)</label><input id="time" type="number" min="0.1" max="30" step="0.1" value="1"><button id="new">Start game</button><h2>Moves</h2><ol id="moves"></ol></aside></div></main><script src="app.js"></script></body></html>
